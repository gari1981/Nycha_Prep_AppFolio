name: NYCHA Prep AppFolio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate Google access or refresh all three reports
        required: true
        default: validate
        type: choice
        options:
          - validate
          - refresh

permissions:
  contents: read

concurrency:
  group: nycha-prep-appfolio
  cancel-in-progress: false

jobs:
  appfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      NYCHA_PREP_SPREADSHEET_ID: ${{ vars.NYCHA_PREP_SPREADSHEET_ID }}
      APPFOLIO_LOGIN_SPREADSHEET_ID: ${{ vars.APPFOLIO_LOGIN_SPREADSHEET_ID }}
      APPFOLIO_URL: ${{ vars.APPFOLIO_URL }}
      RUN_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium and Linux dependencies
        if: inputs.mode == 'refresh'
        run: python -m playwright install --with-deps chromium
      - name: Run worker
        shell: bash
        run: |
          case "$RUN_MODE" in
            validate) python run_ci.py --validate-only ;;
            refresh) python run_ci.py --run-now ;;
            *) echo "Unsupported mode"; exit 2 ;;
          esac
